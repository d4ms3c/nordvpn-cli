<svg xmlns="http://www.w3.org/2000/svg" width="880" height="416" viewBox="0 0 880 416" role="img" aria-labelledby="title">
  <title id="title">nordvpn connect germany, then nordvpn status, in a terminal</title>
  <style>
    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .ok { fill: #3fb950; }
    .bold { font-weight: 700; }
    .title { font-size: 13px; fill: #8b949e; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="415" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 12.5a12 12 0 0 1 12-12h855a12 12 0 0 1 12 12v27.5h-879z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="440" y="25" text-anchor="middle" class="title">zsh</text>

  <text x="28" y="76"><tspan class="dim">$ </tspan>nordvpn connect germany</text>
  <text x="28" y="100">Connecting to <tspan class="bold">Germany</tspan>…</text>
  <text x="28" y="124"><tspan class="ok">Connected</tspan> to <tspan class="bold">Germany #1141</tspan> · 203.0.113.42</text>

  <text x="28" y="172"><tspan class="dim">$ </tspan>nordvpn status</text>
  <text x="28" y="196" class="dim">Status</text><text x="128" y="196" class="ok">Connected</text>
  <text x="28" y="220" class="dim">Server</text><text x="128" y="220">Germany #1141</text>
  <text x="28" y="244" class="dim">Location</text><text x="128" y="244">Frankfurt, Germany</text>
  <text x="28" y="268" class="dim">Public IP</text><text x="128" y="268" class="ok">203.0.113.42</text>
  <text x="28" y="292" class="dim">Profile</text><text x="128" y="292">NordVPN - NordLynx <tspan class="dim">(utun4)</tspan></text>
  <text x="28" y="316" class="dim">Uptime</text><text x="128" y="316">12s</text>

  <text x="28" y="364"><tspan class="dim">$ </tspan>nordvpn status --json | jq .publicIP.protected</text>
  <text x="28" y="388" class="ok">true</text>
</svg>
