name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: CLI contracts
        run: python3 scripts/smoke-test.py .build/release/nordvpn
